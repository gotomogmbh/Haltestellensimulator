services:
  db:
    image: postgis/postgis:16-3.4
    container_name: haltestellensimulator-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: haltestellensimulator
    ports:
      - "5432:5432"
    volumes:
      - haltesim-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d haltestellensimulator"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  haltesim-pgdata:
